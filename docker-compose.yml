services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - ${LLC_API_PORT:-8000}
    env_file:
      - .env
    environment:
      LLC_API_HOST: 0.0.0.0
      LLC_API_PORT: ${LLC_API_PORT:-8000}
    ports:
      - "${LLC_API_PORT:-8000}:${LLC_API_PORT:-8000}"
    volumes:
      - ${WORKSPACE:-.}:/workspace
    working_dir: /workspace

  frontend:
    image: node:22-alpine
    command: >
      sh -c "if [ ! -f node_modules/.bin/vite ] ||
      [ ! -f node_modules/.llc-last-package-lock ] ||
      ! cmp -s package-lock.json node_modules/.llc-last-package-lock; then
      npm ci && cp package-lock.json node_modules/.llc-last-package-lock; fi &&
      npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      VITE_LLC_API_BASE_URL: http://localhost:${LLC_API_PORT:-8000}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${LLC_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./llc-frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app

volumes:
  frontend_node_modules:
