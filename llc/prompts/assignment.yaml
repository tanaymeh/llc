assignment_prompt: |
  Assigned task:
  {task}

  Execute this task and provide a clear final result.

assignment_with_context_prompt: |
  Assigned task:
  {task}

  Relevant context:
  {context}

  Execute the task using the context and provide a clear final result.

revision_task_prompt: |
  Original task:
  {base_task}

  Prior attempt output:
  {prior_output}

  Revision instructions:
  {feedback}

  Produce an improved final result.

