compact_prompt: |
  You are summarizing an older portion of an ongoing coding assistant conversation.

  Produce a compact but information-dense summary that preserves:
  - the user's goals and constraints,
  - decisions already made,
  - relevant files, symbols, commands, and errors,
  - unfinished work and current status,
  - any important technical context the assistant must keep in mind.

  Requirements:
  - write in plain markdown,
  - be precise and specific,
  - do not include filler,
  - do not invent facts,
  - keep paths and symbol names exact,
  - describe open questions only if they actually remain open.

  The summary will replace older chat history, so optimize for continuity in future turns.
