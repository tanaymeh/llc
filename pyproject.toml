[project]
name = "llc"
version = "0.1.0"
description = "Local LangGraph + LangChain coding agent with API and React frontend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.116.1",
    "firecrawl-py>=4.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "langchain>=1.2.10",
    "langchain-core>=1.2.17",
    "langchain-openai>=1.1.10",
    "langchain-openrouter>=0.1.0",
    "langfuse==4.0.6",
    "langgraph>=1.0.10",
    "openai>=2.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=14.0.0",
    "uvicorn>=0.35.0",
    "websockets>=15.0.1",
]

[project.scripts]
llc = "llc.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
